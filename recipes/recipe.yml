# yaml-language-server: $schema=https://blue-build.org
name: ideapad310-15isk
description: OS for Lenovo IdeaPad 310-15ISK with nvidia geforce 920mx

base-image: ghcr.io/ublue-os/silverblue-main
image-version: 44

modules:
  # 1. Akmods in cima: trova la base pulita e installa Nvidia senza conflitti multilib
  - type: akmods
    install: []
    nvidia-driver: nvidia

  # 2. DNF installa i pacchetti rimanenti e rimuove firefox
  - type: dnf
    install:
      packages:
        - intel-media-driver
        - thermald
    remove:
      packages:
        - firefox
        - firefox-langpacks

  # 3. Blocco finale dedicato solo a far sparire le tracce dei repo dall'immagine finale
  - type: dnf
    repos:
      cleanup: true

  # 4. Flatpak di sistema
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.torproject.torbrowser-launcher
          - org.libreoffice.LibreOffice
          - org.kde.okular
          - org.gnome.Evolution
          - io.missioncenter.MissionCenter
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          - com.mattjakeman.ExtensionManager
          - org.gnome.Boxes
          - org.qbittorrent.qBittorrent
          - io.github.celluloid_player.Celluloid
          - org.fedoraproject.MediaWriter
