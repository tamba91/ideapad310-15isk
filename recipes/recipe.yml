# yaml-language-server: $schema=https://blue-build.org
name: ideapad310-15isk
description: OS for Lenovo IdeaPad 310-15ISK with nvidia geforce 920mx

base-image: ghcr.io/ublue-os/silverblue-main
image-version: 44

modules:
  - type: dnf
    remove:
      packages:
        - firefox
        - firefox-langpacks
        - gnome-software
  
  - type: akmods
    install: []
    nvidia-driver: nvidia 

  - type: kargs
    kargs:
      - rd.driver.blacklist=nova-core
      - modprobe.blacklist=nova-core
      - systemd.tpm2_wait=false
        
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - io.github.kolunmi.Bazaar
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          - io.missioncenter.MissionCenter
          - com.mattjakeman.ExtensionManager
          - org.gnome.Logs
          - org.gnome.baobab
          - org.fedoraproject.MediaWriter
          - org.gnome.Calculator
          - org.gnome.TextEditor
          - org.gnome.Loupe                  
          - org.gnome.font-viewer
          - org.gnome.Connections             
          - org.gnome.Snapshot               
          - org.gnome.Calendar
          - org.gnome.clocks
          - org.gnome.Weather
          - org.gnome.Showtime
          - org.gnome.Decibels
          - org.gnome.Evolution
          - org.gnome.Boxes
          - org.mozilla.firefox
          - org.torproject.torbrowser-launcher
          - org.libreoffice.LibreOffice
          - org.kde.okular
          - org.qbittorrent.qBittorrent
          
  - type: signing 
